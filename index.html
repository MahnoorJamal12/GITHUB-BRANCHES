<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup and Login Form with Navbar and Theme Toggle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar with Theme Toggle -->
    <nav class="navbar">
        <div class="navbar-container">
            <h2>My Website</h2>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </div>
    </nav>

    <div class="container">
        <!-- Login Form -->
        <div id="loginForm" class="form-container">
            <h2>Login</h2>
            <form onsubmit="return login(event)">
                <label for="loginEmail">Email:</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required><br><br>
                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required><br><br>
                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <a href="javascript:void(0);" onclick="toggleForms('signup')">Signup</a></p>
        </div>

        <!-- Signup Form -->
        <div id="signupForm" class="form-container" style="display: none;">
            <h2>Signup</h2>
            <form onsubmit="return signup(event)">
                <label for="signupName">Name:</label>
                <input type="text" id="signupName" placeholder="Enter your name" required><br><br>
                <label for="signupEmail">Email:</label>
                <input type="email" id="signupEmail" placeholder="Enter your email" required><br><br>
                <label for="signupPassword">Password:</label>
                <input type="password" id="signupPassword" placeholder="Enter your password" required><br><br>
                <button type="submit">Signup</button>
            </form>
            <p>Already have an account? <a href="javascript:void(0);" onclick="toggleForms('login')">Login</a></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
